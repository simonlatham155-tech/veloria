name: Brown IDSS UI integration

on:
  push:
    branches: [agent/vst3-test-build]
    paths:
      - .github/workflows/brown-idss-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vst3-test-build
          fetch-depth: 0

      - name: Wire Brown IDSS switch and credit into editor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Source/PluginEditor.cpp')
          s = p.read_text()

          def rep(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'Missing block: {label}')
              s = s.replace(old, new, 1)

          rep(
'''    orderButton.onClick=[this]{auto* raw=audioProcessor.parameters.getRawParameterValue("walkOrder");auto* param=audioProcessor.parameters.getParameter("walkOrder");if(!raw||!param)return;const auto next=raw->load()>=1.5f?1.0f:2.0f;param->beginChangeGesture();param->setValueNotifyingHost(param->convertTo0to1(next));param->endChangeGesture();refreshOrderButton();}; addAndMakeVisible(orderButton); refreshOrderButton();
''',
'''    orderButton.onClick=[this]{auto* raw=audioProcessor.parameters.getRawParameterValue("walkOrder");auto* param=audioProcessor.parameters.getParameter("walkOrder");if(!raw||!param)return;const auto next=raw->load()>=1.5f?1.0f:2.0f;param->beginChangeGesture();param->setValueNotifyingHost(param->convertTo0to1(next));param->endChangeGesture();refreshOrderButton();}; addAndMakeVisible(orderButton); refreshOrderButton();
    engineButton.setColour(juce::TextButton::buttonColourId,gold.withAlpha(0.15f)); engineButton.setColour(juce::TextButton::textColourOffId,gold.withAlpha(0.92f));
    engineButton.onClick=[this]{audioProcessor.setBrownIdssMode(!audioProcessor.isBrownIdssMode());refreshEngineButton();presetStatus.setText(audioProcessor.isBrownIdssMode()?"BROWN IDSS: INTERACTIVE DSS OPERATING MODEL":"VELORIA: MODERN DSS OPERATING MODEL",juce::dontSendNotification);}; addAndMakeVisible(engineButton); refreshEngineButton();
''', 'engine button constructor')

          rep(
'''static_cast<juce::Component*>(&presetBox),static_cast<juce::Component*>(&monoButton),static_cast<juce::Component*>(&orderButton),static_cast<juce::Component*>(&discoverButton)''',
'''static_cast<juce::Component*>(&presetBox),static_cast<juce::Component*>(&monoButton),static_cast<juce::Component*>(&orderButton),static_cast<juce::Component*>(&engineButton),static_cast<juce::Component*>(&discoverButton)''', 'what if visibility')

          rep(
'''void VeloriaAudioProcessorEditor::refreshOrderButton(){const auto order=parameterValue(audioProcessor.parameters,"walkOrder")>=1.5f?2:1;orderButton.setButtonText("ORDER "+juce::String(order));}
''',
'''void VeloriaAudioProcessorEditor::refreshOrderButton(){const auto order=parameterValue(audioProcessor.parameters,"walkOrder")>=1.5f?2:1;orderButton.setButtonText("ORDER "+juce::String(order));}
void VeloriaAudioProcessorEditor::refreshEngineButton(){const auto brown=audioProcessor.isBrownIdssMode();engineButton.setButtonText(brown?"ENGINE: BROWN IDSS":"ENGINE: VELORIA");engineButton.setColour(juce::TextButton::buttonColourId,(brown?gold:purple).withAlpha(brown?0.24f:0.16f));}
''', 'refresh engine')

          rep('''    refreshOrderButton(); repaint();
''','''    refreshOrderButton(); refreshEngineButton(); repaint();
''','timer engine refresh')

          rep(
'''    g.setColour(juce::Colours::white.withAlpha(0.34f));g.setFont(juce::FontOptions(8.5f,juce::Font::bold));g.drawText("2026  //  VELORIA - THE INSTRUMENT FROM THIS SYNTHESIS HISTORY THAT NEVER HAPPENED.",(int)content.getX()+20,(int)content.getBottom()-24,(int)content.getWidth()-40,16,juce::Justification::centred);
''',
'''    g.setColour(gold.withAlpha(0.64f));g.setFont(juce::FontOptions(8.2f,juce::Font::bold));g.drawText("REAL HISTORY: ANDREW R. BROWN + GREG JENKINS / IDSS 2004-05  -  REAL-TIME INTERACTIVE DSS + STOCHASTIC PERCUSSION",(int)content.getX()+20,(int)content.getBottom()-40,(int)content.getWidth()-40,14,juce::Justification::centred);
    g.setColour(juce::Colours::white.withAlpha(0.34f));g.setFont(juce::FontOptions(8.5f,juce::Font::bold));g.drawText("2026  //  VELORIA - THE INSTRUMENT FROM THIS SYNTHESIS HISTORY THAT NEVER HAPPENED.",(int)content.getX()+20,(int)content.getBottom()-24,(int)content.getWidth()-40,16,juce::Justification::centred);
''', 'Brown credit')

          rep(
'''ampDist.setBounds(24,374,70,104);timeDist.setBounds(100,374,70,104);ampStep.setBounds(176,374,70,104);timeStep.setBounds(252,374,70,104);chaos.setBounds(24,490,70,104);breakpoints.setBounds(100,490,70,104);pitchStability.setBounds(176,490,70,104);curve.setBounds(252,490,70,104);orderButton.setBounds(25,600,68,20);
''',
'''ampDist.setBounds(24,374,70,104);timeDist.setBounds(100,374,70,104);ampStep.setBounds(176,374,70,104);timeStep.setBounds(252,374,70,104);chaos.setBounds(24,490,70,104);breakpoints.setBounds(100,490,70,104);pitchStability.setBounds(176,490,70,104);curve.setBounds(252,490,70,104);orderButton.setBounds(25,600,68,20);engineButton.setBounds(103,600,215,20);
''', 'engine bounds')

          p.write_text(s)
          PY

      - name: Commit editor integration
        run: |
          git config user.name "Veloria Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add Source/PluginEditor.cpp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Wire Brown IDSS engine switch and historical credit"
          git push origin HEAD:agent/vst3-test-build
