name: Build macOS VST3

on:
  workflow_dispatch:
  push:
    branches:
      - agent/vst3-test-build
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/vst3-test-build
          fetch-depth: 0

      - name: Apply Veloria architecture consistency fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def rep(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Missing expected block: {label}")
              return text.replace(old, new, 1)

          p=Path('Source/PluginProcessor.h'); s=p.read_text()
          s=rep(s,'    VisualState getVisualState() const noexcept;\n','    VisualState getVisualState() const noexcept;\n    bool isDrumMode() const noexcept { return drumMode; }\n','drum accessor')
          s=rep(s,'        float gain { 1.0f };\n','        float gain { 1.0f };\n        float pressure { 0.0f };\n','pressure')
          p.write_text(s)

          p=Path('Source/PluginProcessor.cpp'); s=p.read_text()
          s=rep(s,
          '''        if (message.isController())
                      handleMidiController(message);
                  if (message.isNoteOn())
