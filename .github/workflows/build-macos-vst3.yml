name: Build macOS VST3

on:
  workflow_dispatch:
  push:
    branches:
      - agent/vst3-test-build
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/vst3-test-build

      # The GitHub connector stores the supplied high-resolution JPEG losslessly
      # as base64 text. Recreate the actual JPEG before CMake/JUCE embeds it so
      # BinaryData contains the 1055x1491 artwork, not the old thumbnail asset.
      - name: Restore high-resolution WHAT IF artwork
        run: |
          /usr/bin/openssl base64 -d -A \
            -in assets/what_if_history.b64.part00 \
            -out assets/what_if_history.jpg
          test -s assets/what_if_history.jpg
          WIDTH=$(sips -g pixelWidth assets/what_if_history.jpg | awk '/pixelWidth/ {print $2}')
          HEIGHT=$(sips -g pixelHeight assets/what_if_history.jpg | awk '/pixelHeight/ {print $2}')
          echo "WHAT IF artwork: ${WIDTH}x${HEIGHT}"
          test "$WIDTH" = "1055"
          test "$HEIGHT" = "1491"

      - name: Integrate extended stochastic controls into source
        run: |
          if grep -q "setBoundaryDrive" Source/dsp/StochasticOscillator.h; then
            echo "Extended stochastic controls already integrated in source"
          else
            python3 tools/apply_extended_stochastic_controls.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Source/PluginProcessor.cpp Source/PluginProcessor.h Source/PluginEditor.cpp Source/PluginEditor.h Source/dsp/StochasticOscillator.h
            git commit -m "Integrate Boundary Rate Jump Correlation controls"
            git push origin HEAD:agent/vst3-test-build
          fi

      - name: Apply reference-inspired compact UI layout
        run: |
          if grep -q 'drawPanel(g,{14,74,430,786}' Source/PluginEditor.cpp; then
            echo "Compact UI layout already integrated in source"
          else
            python3 tools/apply_reference_layout.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Source/PluginEditor.cpp
            git commit -m "Rework Veloria layout and compact ADSR"
            git push origin HEAD:agent/vst3-test-build
          fi

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --config Release --target Veloria_VST3 --parallel 3

      - name: Package VST3
        run: |
          test -d "build/Veloria_artefacts/Release/VST3/Veloria.vst3"
          mkdir -p artifact
          ditto -c -k --sequesterRsrc --keepParent \
            "build/Veloria_artefacts/Release/VST3/Veloria.vst3" \
            "artifact/Veloria-macOS-VST3.zip"

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Veloria-macOS-VST3
          path: artifact/Veloria-macOS-VST3.zip
          if-no-files-found: error
