          new='void VeloriaAudioProcessorEditor::timerCallback(){visualState=audioProcessor.getVisualState();rotationPhase+=0.0022f+visualState.energy*0.0095f;if(rotationPhase>juce::MathConstants<float>::twoPi)rotationPhase-=juce::MathConstants<float>::twoPi;voiceStatus.setText("VOICE ENGINE   "+juce::String(visualState.activeVoices)+" / 8 ACTIVE",juce::dontSendNotification);fieldStatus.setText(juce::String(visualState.activeVoices)+" VOICES  //  "+juce::String((int)(visualState.energy*100.0f))+"% ENERGY",juce::dontSendNotification);const auto drums=audioProcessor.isDrumMode();for(auto* e:{&attack,&decay,&sustain,&release}){e->setEnabled(!drums);e->setAlpha(drums?.30f:1.0f);}if(drums)presetStatus.setText("DRUM MODE: STOCHASTIC ONE-SHOT ENVELOPES",juce::dontSendNotification);refreshOrderButton();repaint();}'
          s=rep(s,old,new,'drum ADSR')
