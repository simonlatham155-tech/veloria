                  voice.oscillator.setWalkOrder(walkOrder);
                  voice.oscillator.setActiveBreakpointCount(breakpoints);
                  voice.oscillator.setPitchStability(juce::jlimit(0.0f,1.0f,effectivePitchStability*(1.0f-expression*0.16f)));
