name: Build Veloria v1.1 macOS

on:
  workflow_dispatch:
  push:
    branches:
      - agent/veloria-v1.1
  pull_request:
    branches:
      - agent/vst3-test-build

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout v1.1 source
        uses: actions/checkout@v4

      - name: Restore high-resolution WHAT IF artwork
        run: |
          /usr/bin/openssl base64 -d -A \
            -in assets/what_if_history.b64.part00 \
            -out assets/what_if_history.jpg
          test -s assets/what_if_history.jpg
          WIDTH=$(sips -g pixelWidth assets/what_if_history.jpg | awk '/pixelWidth/ {print $2}')
          HEIGHT=$(sips -g pixelHeight assets/what_if_history.jpg | awk '/pixelHeight/ {print $2}')
          echo "WHAT IF artwork: ${WIDTH}x${HEIGHT}"
          test "$WIDTH" = "1055"
          test "$HEIGHT" = "1491"

      - name: Configure release build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --config Release --target Veloria_VST3 --parallel 3

      - name: Verify bundle
        run: |
          test -d "build/Veloria_artefacts/Release/VST3/Veloria.vst3"
          test -f "build/Veloria_artefacts/Release/VST3/Veloria.vst3/Contents/MacOS/Veloria"
          file "build/Veloria_artefacts/Release/VST3/Veloria.vst3/Contents/MacOS/Veloria"

      - name: Package VST3
        run: |
          mkdir -p artifact
          ditto -c -k --sequesterRsrc --keepParent \
            "build/Veloria_artefacts/Release/VST3/Veloria.vst3" \
            "artifact/Veloria-v1.1-macOS-VST3.zip"

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Veloria-v1.1-macOS-VST3
          path: artifact/Veloria-v1.1-macOS-VST3.zip
          if-no-files-found: error
          retention-days: 14
