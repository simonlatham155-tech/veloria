              const auto barrierSpan=juce::jlimit(0.0f,1.0f,(ampBarrier+timeBarrier)*.5f),stepEnergy=juce::jlimit(0.0f,1.0f,((ampStepValue+timeStepValue)*.5f-.10f)/1.90f),distributionEnergy=juce::jlimit(0.0f,1.0f,(ampDistValue+timeDistValue)/10.0f);
              const auto energy=juce::jlimit(0.0f,1.0f,visualState.energy),activity=juce::jlimit(0.0f,1.0f,.25f+aw*.12f+tw*.11f+energy*.14f+chaosValue*.13f+stepEnergy*.10f+barrierSpan*.08f+distributionEnergy*.05f);
          '''
          s=rep(s,old,new,'globe controls')
          s=rep(s,'for(std::size_t i=0;i<pts.size();++i){const auto a=rotationPhase-juce::MathConstants<float>::halfPi+juce::MathConstants<float>::twoPi*(cumulative/juce::jmax(.001f,total));cumulative+=juce::jmax(.001f,visualState.durations[i]);const auto radial=r*(.54f+visualState.amplitudes[i]*.24f);const auto depth=.75f+.20f*std::sin(a*1.9f+rotationPhase*.61f+i*.31f);pts[i]={c.x+std::cos(a)*radial,c.y+std::sin(a)*radial*depth};}','for(std::size_t i=0;i<pts.size();++i){const auto a=rotationPhase-juce::MathConstants<float>::halfPi+juce::MathConstants<float>::twoPi*(cumulative/juce::jmax(.001f,total));cumulative+=juce::jmax(.001f,visualState.durations[i]);const auto active=(int)i<activePoints;const auto radial=active?r*((.38f+.20f*barrierSpan)+visualState.amplitudes[i]*(.14f+.13f*ampBarrier)):r*.055f;const auto depth=.62f+.27f*timeBarrier+.10f*std::sin(a*(1.55f+.55f*orderValue)+rotationPhase*(.42f+.26f*(1.0f-pitchLockValue))+i*.31f);pts[i]={c.x+std::cos(a)*radial,c.y+std::sin(a)*radial*depth};}','active points')
          s=rep(s,'const auto shell=.24f+.70f*std::sqrt(hash01(h*47+3));','const auto shell=.18f+(.52f+.25f*barrierSpan)*std::sqrt(hash01(h*47+3));','barrier shell')
          s=rep(s,'const auto radial=std::pow(hash01(i*37+11),.38f);const auto angle=fi*2.39996323f+rotationPhase*(.07f+(i%31)*.0035f)+std::sin(fi*.031f)*chaosValue*.28f;','const auto radial=std::pow(hash01(i*37+11),.30f+(1.0f-barrierSpan)*.30f);const auto angle=fi*2.39996323f+rotationPhase*((orderValue<1.5f?-.055f:.07f)+(i%31)*.0035f)+std::sin(fi*.031f)*(chaosValue*.28f+distributionEnergy*.12f);','particle field')
          s=rep(s,'const bool hot=i%181==0;const auto size=hot?2.4f:.30f+near*.92f;','const auto hotModulo=juce::jmax(71,181-(int)(stepEnergy*78.0f));const bool hot=i%hotModulo==0;const auto size=hot?2.4f+stepEnergy*.8f:.30f+near*.92f;','step events')
          s=rep(s,'const auto bend=r*(.025f+.16f*hash01(strand*19+5))*(.75f+chaosValue*.6f);','const auto bend=r*(.018f+(.08f+.10f*stepEnergy)*hash01(strand*19+5))*(.68f+chaosValue*.55f+distributionEnergy*.22f)*(1.10f-curveValue*.30f);','filaments')
          s=rep(s,'for(std::size_t i=0;i<pts.size();++i){const auto amp=std::abs(visualState.amplitudes[i]);const auto nr=1.5f+amp*1.8f+energy*.3f;','for(std::size_t i=0;i<pts.size();++i){if((int)i>=activePoints)continue;const auto amp=std::abs(visualState.amplitudes[i]);const auto nr=1.5f+amp*1.8f+energy*.3f;','inactive nodes')
          p.write_text(s)

          Path('README.md').write_text('''# Latham Audio Veloria

**Fifty years of synthesis that never happened.**

Veloria is a playable polyphonic Dynamic Stochastic Synthesis instrument: an alternate history of what stochastic synthesis might have become if it had received the same decades of instrument design and musical refinement as analogue, FM and wavetable synthesis.

## Locked architecture

The waveform itself is the stochastic system. Four performance controls are AMP WALK, TIME WALK, AMP BARRIER and TIME BARRIER. Eight shaping controls are AMP DIST, TIME DIST, AMP STEP, TIME STEP, CHAOS, POINTS, PITCH LOCK and CURVE, plus the ORDER 1/2 switch. CHAOS remains a DSS macro rather than an unrelated noise/distortion stage.

ADSR, velocity, mono/polyphony and level surround the stochastic generator. Polyphonic and channel aftertouch push held notes deeper into the field by increasing walk/step energy and slightly relaxing pitch lock.

## Instrument families

Factory families are **GENDYN Core, Piano, Pad, Strings, Bass, Lead, Bell, Pluck, FX and Drums**. Piano, strings and the other familiar names mean a 1970s-style synthesizer attempt at those identities, not acoustic modelling. DISCOVER is family-aware, so it explores inside the selected instrument grammar instead of abandoning it. Drum discovery stays percussion-only.

Drums use stochastic one-shot envelopes: kick contraction, a two-engine snare body/wire structure, hats, crash and toms. The tonal ADSR is therefore visibly inactive in Drum mode.

## Living Planet

The globe is a live mathematical view. POINTS determines which of the twelve possible breakpoint nodes are active. Barriers affect spatial spread, step size affects event energy, distribution/order/curve affect trajectories, pitch lock affects temporal coherence, and actual voice energy drives intensity. The five macro anchors organise the visual world but are not fake DSP breakpoints.

## WHAT IF?

The in-app alternate history runs from the 1970s Xenakis System 55 through the Gendy-D Lead, Stochastic-303 and Stochastic-909 to **Veloria 2026 — the instrument from the synthesis history that never happened.**

## Product principles

- Musical before mathematical.
- Stable identity, living performance.
- Seeded recallability.
- Every visible control is meaningful.
- One coherent stochastic synthesis language.
- No runtime AI dependency.

Veloria uses C++20, JUCE and CMake. VST3 is the active test target; Audio Unit and Standalone remain planned.
''')
          PY

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --config Release --target Veloria_VST3 --parallel 3

      - name: Commit verified architecture fixes
        if: github.event_name == 'push'
        run: |
          git config user.name "Veloria Architecture Bot"
          git config user.email "actions@users.noreply.github.com"
          git add Source/PluginProcessor.h Source/PluginProcessor.cpp Source/PluginEditor.cpp README.md
          if ! git diff --cached --quiet; then
            git commit -m "Align Veloria architecture and interaction details"
            git push origin HEAD:agent/vst3-test-build
          fi

      - name: Package VST3
        run: |
          test -d "build/Veloria_artefacts/Release/VST3/Veloria.vst3"
          mkdir -p artifact
          ditto -c -k --sequesterRsrc --keepParent \
            "build/Veloria_artefacts/Release/VST3/Veloria.vst3" \
            "artifact/Veloria-macOS-VST3.zip"

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Veloria-macOS-VST3
          path: artifact/Veloria-macOS-VST3.zip
          if-no-files-found: error
