name: Fix PluginEditor compile errors

on:
  push:
    branches:
      - agent/vst3-test-build

permissions:
  contents: write

jobs:
  fix-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vst3-test-build
          fetch-depth: 0

      - name: Apply four compiler fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Source/PluginEditor.cpp')
          s = p.read_text()
          replacements = [
              ('const auto centre=dial.getCentre(), radius=size*0.43f;',
               'const auto centre=dial.getCentre(); const auto radius=size*0.43f;'),
              ('g.fillRect(x,box.getBottom()-35,18,24);',
               'g.fillRect(x,box.getBottom()-35.0f,18.0f,24.0f);'),
              ('g.fillRect(x,drum.getBottom()-20,8,11);',
               'g.fillRect(x,drum.getBottom()-20.0f,8.0f,11.0f);'),
              ('const auto anchor=anchors[(std::size_t)a],e=aEnergy[(std::size_t)a];',
               'const auto anchor=anchors[(std::size_t)a]; const auto e=aEnergy[(std::size_t)a];'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit('Expected compiler-error line not found: ' + old)
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --config Release --target Veloria_VST3

      - name: Commit fixes after successful build
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Source/PluginEditor.cpp
          git commit -m 'Fix PluginEditor C++ type ambiguities'
          git push origin HEAD:agent/vst3-test-build
