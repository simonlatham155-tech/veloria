              'step/distribution/curve filament bends')
          s = replace_once(s,
              'for(std::size_t i=0;i<pts.size();++i){const auto amp=std::abs(visualState.amplitudes[i]);const auto nr=1.5f+amp*1.8f+energy*.3f;',
              'for(std::size_t i=0;i<pts.size();++i){if((int)i>=activePoints)continue;const auto amp=std::abs(visualState.amplitudes[i]);const auto nr=1.5f+amp*1.8f+energy*.3f;',
              'hide inactive breakpoint nodes')
          p.write_text(s)

          # ---- README: make the documented architecture match the actual instrument.
          p = Path('README.md')
          p.write_text('''# Latham Audio Veloria

**Fifty years of synthesis that never happened.**

Veloria is a playable polyphonic Dynamic Stochastic Synthesis instrument: an alternate history of what stochastic synthesis might have become if it had received the same decades of instrument design, performance refinement and musical culture as analogue, FM and wavetable synthesis.

The aim is not to recreate GENDYN as an academic exhibit. Veloria turns breakpoint mutation, reflecting barriers, random-walk order and probability distributions into a coherent instrument whose patches remain recognisable while never becoming mechanically identical.

## Locked architecture

The waveform itself is the stochastic system. There is no hidden subtractive oscillator/filter architecture underneath it.

### Four performance field controls

- **AMP WALK** — how readily breakpoint amplitudes move.
- **TIME WALK** — how readily breakpoint durations move.
- **AMP BARRIER** — the amplitude space available to the reflecting random walk.
- **TIME BARRIER** — the duration space available to the reflecting random walk.

### Eight shaping controls + one order switch

- **AMP DIST / TIME DIST** — Adaptive, Uniform, Gaussian, Logistic, Cauchy or Arcsine mutation statistics.
- **AMP STEP / TIME STEP** — mutation reach.
- **CHAOS** — a true DSS performance macro that expands stochastic reach and relaxes pitch anchoring; it does not add an unrelated noise/distortion engine.
- **POINTS** — 4–12 active waveform breakpoints.
- **PITCH LOCK** — how strongly the duration field is normalised back to keyboard pitch.
- **CURVE** — interpolation between evolving breakpoints.
- **ORDER 1 / 2** — first-order position walks versus second-order step/momentum walks.

ADSR, velocity, mono/polyphony and level are performance architecture around the stochastic generator. Polyphonic and channel aftertouch push held notes deeper into the stochastic field by increasing walk/step energy and slightly relaxing pitch lock.

## Instrument families

Factory families are **GENDYN Core, Piano, Pad, Strings, Bass, Lead, Bell, Pluck, FX and Drums**. These are not claims of acoustic modelling. Piano, strings, bells and the others are deliberately imagined in the spirit of a 1970s synthesizer attempting those instrument identities through its own synthesis language.

**DISCOVER is family-aware.** Piano discovery stays struck, pitched and piano-like; Pad discovery remains slow and evolving; Bass stays compact and stable; Bell keeps sparse, heavy-tailed transients; FX is allowed to become unstable. Drum discovery remains fenced inside percussion grammar.

The Drum family uses a dedicated stochastic one-shot architecture rather than the tonal ADSR: kick pitch/barrier contraction, a two-engine snare (body + wire), closed/open hats, crash and tom behaviour. The UI therefore marks the ADSR section as internal/inactive while Drum mode is selected.

## Living Planet

The central globe is not a decorative screensaver. Its twelve possible nodes are the oscillator breakpoint state; inactive nodes disappear when POINTS is reduced. Field radius responds to barriers, particle events to step energy, trajectory character to distributions/order/curve, motion to walk/chaos, and live intensity to actual voice energy. Five larger macro anchors organise the visual world without pretending to be extra DSP breakpoints.

## Field identity and recall

Seeded randomness makes patches recallable. **NEW FIELD** changes stochastic identity without changing the patch architecture. User presets retain parameters, drum state and MIDI mappings.

## WHAT IF?

Veloria includes an alternate-history feature tracing an imagined commercial lineage from the 1970s Xenakis System 55 through the Gendy-D Lead, Stochastic-303 and Stochastic-909 to **Veloria 2026 — the instrument from the synthesis history that never happened.** This story explains the instrument; it is not a second or fake synthesis engine.

## Product principles

- **Musical before mathematical** — probability systems are translated into playable controls.
- **Stable identity, living performance** — presets remain recognisable without repeating mechanically.
- **Deterministic when required** — seeded randomness makes patches and sessions recallable.
- **Every visible control is meaningful** — no dummy DSP controls.
- **One coherent synthesis language** — stochastic waveform generation remains the source of the sound.
- **No runtime AI dependency** — conventional C++/JUCE DSP.

## Formats and development

Veloria uses C++20, JUCE and CMake. VST3 is the active test target; Audio Unit and Standalone remain planned targets, with AAX possible later.

